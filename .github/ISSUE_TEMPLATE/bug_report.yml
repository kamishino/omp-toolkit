name: Bug report
description: Report a reproducible problem with the toolkit
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, emails, terminal handles, and personal paths before posting.
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: bun
    attributes:
      label: Bun version
      placeholder: 1.4.3
    validations:
      required: true
  - type: input
    id: omp
    attributes:
      label: OMP version
      placeholder: 18.12.5
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      description: Paste only redacted output. Never include API keys or tokens.
